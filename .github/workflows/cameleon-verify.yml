name: CAMELEON verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check server.mjs
      - run: node --check public/game.js
      - run: node --check public/world.js
      - run: node --check test/game.test.mjs
